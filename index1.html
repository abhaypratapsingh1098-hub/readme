<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Template Area Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #5c5b66;
      padding: 24px;
    }

    .grid-container {
      display: grid;
      gap: 20px;
      min-height: calc(100vh - 48px);
      grid-template-columns: 1fr 3fr;
      grid-template-rows: 70px 1fr 70px;
      grid-template-areas:
        "header  header"
        "sidebar main"
        "footer  footer";
    }

    .header,
    .sidebar,
    .main,
    .footer {
      background-color: #e4e2f0;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .header {
      grid-area: header;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    .logo {
      font-size: 1.25rem;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links span {
      display: block;
      width: 48px;
      height: 6px;
      background-color: #c7c3dc;
      border-radius: 3px;
    }

    .sidebar {
      grid-area: sidebar;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main {
      grid-area: main;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer {
      grid-area: footer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
        grid-template-rows: 70px 150px 1fr 70px;
        grid-template-areas:
          "header"
          "sidebar"
          "main"
          "footer";
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <header class="header">
      <span class="logo">Logo</span>
      <nav class="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </nav>
    </header>

    <aside class="sidebar">Sidebar</aside>
    <main class="main">Main</main>
    <footer class="footer">Footer</footer>
  </div>

</body>
</html>
